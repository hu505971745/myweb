    <script>
      (() => {
        const root = document.documentElement;
        // Mobile browsers fit the same 1440px desktop canvas in both orientations.
        // Keep pinch zoom available; no separate mobile reflow is applied.
        const mobileCanvas = matchMedia("(pointer: coarse)").matches;
        root.classList.toggle("desktop-scaled-mobile", mobileCanvas);
        if (mobileCanvas) {
          const viewport = document.querySelector('meta[name="viewport"]');
          let previousWidth = 0;
          const fitCanvas = () => {
            const width = Math.round(window.visualViewport
              ? visualViewport.width * visualViewport.scale : screen.width);
            if (!width || Math.abs(width - previousWidth) < 2) return;
            previousWidth = width;
            root.style.setProperty("--mobile-content-zoom", Math.max(1, width - 36) / width);
            root.style.setProperty("--mobile-ui-unit", `${1440 / width}px`);
            viewport.content = `width=1440, initial-scale=${width / 1440}`;
          };
          fitCanvas();
          window.addEventListener("resize", fitCanvas, { passive: true });
          window.addEventListener("orientationchange", () => requestAnimationFrame(fitCanvas));
          // Touch devices open directly into the page; desktop keeps its curtain.
          return;
        }
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        root.dataset.entrance = "loading";
        // Release the page even if the animation script fails to load.
        window.__hfEntranceFallback = setTimeout(() => {
          document.dispatchEvent(new Event("portfolio:entrance-timeout"));
          delete root.dataset.entrance;
          document.getElementById("portfolio-entrance")?.remove();
          const app = document.getElementById("app");
          if (app) app.inert = false;
          document.dispatchEvent(new Event("portfolio:entrance-reveal"));
        }, 4500);
      })();
    </script>
